<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronous JavaScript Practice</title>

</head>
<body>

    <h1>Understanding Asynchronous</h1>


 <form id="postForm">

        <label for="title">Post Title</label><br>

        <input
            type="text"
            id="title"
            placeholder="Post Title"
            required
        >

        <br><br>

        <label for="body">Post Body</label><br>

        <textarea
            id="body"
            placeholder="Write your post"
            required
        ></textarea>

        <br><br>

        <button type="submit">

            Submit

        </button>

        <h2>Result</h2>

        <div id="result"></div>
        
    </form>

    <script src="script.js"></script>
    
</body>
</html>
